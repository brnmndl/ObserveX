services:
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      # Admin credentials (set GF_SECURITY_ADMIN_PASSWORD in .env)
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      # Anonymous access — view dashboards only, no editing
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Restrict Viewer role to dashboards only
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1d"
      # Hide settings/admin UI from non-admins
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_EXPLORE_ENABLED: "false"
    restart: unless-stopped

volumes:
  grafana-storage:
