global:
  scrape_interval: 1m

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'stock-exporter'
    scrape_interval: 5m
    scrape_timeout: 30s
    static_configs:
      - targets: ['host.docker.internal:8000']